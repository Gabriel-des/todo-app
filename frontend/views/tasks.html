<div class="p-6 max-w-3xl mx-auto" ng-controller="TaskController as task">
  <!-- Formulário de nova tarefa / edição -->
  <form ng-submit="task.isEditing ? task.updateTask(task.actualTask) : task.add()"
    class="bg-white p-4 rounded-md shadow-md mb-6 flex flex-col gap-4">
    <h2 class="text-lg font-semibold text-gray-700">
      {{ task.isEditing ? 'Editar tarefa' : 'Adicionar nova tarefa' }}
    </h2>

    <div class="flex flex-col sm:flex-row gap-4">
      <input ng-model="task.actualTask.title" placeholder="Título" required
        class="flex-1 px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-400">

      <input ng-model="task.actualTask.description" placeholder="Descrição"
        class="flex-1 px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-400">

      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition">
        {{ task.isEditing ? 'Salvar' : 'Adicionar' }}
      </button>
      <button type="button" ng-if="task.isEditing" ng-click="task.cancelEdit()"
        class="bg-gray-400 text-white px-6 py-2 rounded-md hover:bg-gray-500 transition">
        Cancelar
      </button>
    </div>
  </form>

  <!-- Lista de tarefas -->
  <ul class="space-y-3">
    <li ng-repeat="t in task.tasks"
      class="flex items-center justify-between bg-white px-4 py-3 rounded-md shadow-sm border">

      <!-- Conteúdo da tarefa -->
      <div class="flex items-center gap-3">
        <input type="checkbox" ng-model="t.completed" ng-change="task.updateTask(t)"
          class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring focus:ring-blue-300">
        <div>
          <h3 class="font-medium text-gray-800" ng-class="{'line-through text-gray-400': t.completed}">
            {{ t.title }}
          </h3>
          <p class="text-sm text-gray-500" ng-class="{'line-through text-gray-300': t.completed}">
            {{ t.description }}
          </p>
        </div>
      </div>

      <!-- Ações: Editar / Excluir -->
      <div class="flex items-center gap-2">
        <button ng-if="!t.completed"  ng-click="task.startEditing(t)" class="text-green-500 hover:text-green-700 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M11 5H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-5M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z" />
          </svg>
        </button>
        <button ng-click="task.delete(t)" class="text-red-500 hover:text-red-700 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </li>
  </ul>

</div>
