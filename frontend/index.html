<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Todo App AngularJS</title>

  <!-- AngularJS e UI-Router -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
  <script src="https://unpkg.com/@uirouter/angularjs/release/angular-ui-router.min.js"></script>

  <!-- Módulo e configuração de rotas + interceptor -->
  <script src="app.js"></script>

  <!-- Serviços -->
  <script src="services/authentication.service.js"></script>
  <script src="services/task.service.js"></script>

  <!-- Controladores -->
  <script src="controllers/auth.controller.js"></script>
  <script src="controllers/task.controller.js"></script>
</head>
<body ng-app="todoApp">

  <nav>
    <a ui-sref="login">Entrar</a> |
    <a ui-sref="register">Registrar</a> |
    <a ui-sref="tasks">Tarefas</a>
  </nav>

  <div ui-view></div>

</body>
</html>
