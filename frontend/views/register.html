<div class="flex items-center justify-center min-h-screen bg-gray-100" ng-controller="AuthController as auth">
  <form ng-submit="auth.register()" class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm space-y-4">
    <h2 class="text-2xl font-semibold text-center text-gray-700">Cadastro</h2>

    <input type="text" ng-model="auth.credentials.name" placeholder="Nome" required
      class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-400">

    <input type="email" ng-model="auth.credentials.email" placeholder="Email" required
      class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-400">

    <input type="password" ng-model="auth.credentials.password" placeholder="Senha" required
      class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-400">

    <input type="password" ng-model="auth.credentials.password_confirmation" placeholder="Confirme sua senha" required
      class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-400">

    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">
      Registrar
    </button>

    <p ng-if="auth.error" class="text-red-600 text-sm text-center">
      {{auth.error}}
    </p>

    <div class="text-center">
      <a href="#!/login" class="text-blue-600 hover:text-blue-800 text-sm underline transition">
        Já tem uma conta? Entrar
      </a>
    </div>
  </form>
</div>
